include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - validate
  - test
  - observe
  - package

variables:
  GIT_DEPTH: "0"
  MAVEN_USER_HOME: "$CI_PROJECT_DIR/.m2"
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dfile.encoding=UTF-8
    -Duser.timezone=UTC
    -Djava.awt.headless=true
  SECRET_DETECTION_HISTORIC_SCAN: "true"
  SAST_EXCLUDED_ANALYZERS: "spotbugs"

default:
  interruptible: true

.maven-java25:
  image:
    name: "docker.io/library/maven@sha256:7e461cec477077c1d9e50b13df8aef9018764410f4c4cd7c34803f10c4c99e4c"
  before_script:
    - chmod +x mvnw scripts/check-no-secrets.sh ci/package-artifact.sh
      ci/check-gitlab-merge-request.sh ci/run-dependency-check.sh
    - java --version
    - ./mvnw -version

validate:source:
  extends: .maven-java25
  stage: validate
  script:
    - |
      if [ "${CI_PIPELINE_SOURCE:-}" = merge_request_event ]; then
        if [ -n "${CI_COMMIT_BRANCH:-}" ] \
          || [ -n "${CI_COMMIT_TAG:-}" ] \
          || [ -z "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}" ] \
          || [ -z "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ]; then
          echo 'FAIL: une Merge Request GitLab exige CI_COMMIT_BRANCH/CI_COMMIT_TAG vides et des branches source/cible MR non vides.' >&2
          exit 1
        fi
        project_version=$(./mvnw -q -DforceStdout help:evaluate \
          -Dexpression=project.version)
        if [ -z "${CI_PROJECT_ID:-}" ] \
          || [ -z "${CI_MERGE_REQUEST_PROJECT_ID:-}" ] \
          || [ -z "${CI_MERGE_REQUEST_SOURCE_PROJECT_ID:-}" ] \
          || [ "$CI_PROJECT_ID" != "$CI_MERGE_REQUEST_PROJECT_ID" ] \
          || [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_MERGE_REQUEST_PROJECT_ID" ]; then
          sh ci/check-gitlab-merge-request.sh "$project_version"
        fi
        sh ci/check-branch-name.sh \
          "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" feature-integration
        sh ci/check-branch-name.sh \
          "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" gitlab-release
        git fetch --force --tags origin \
          "+refs/heads/main:refs/remotes/origin/main" \
          "+refs/heads/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" \
          "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      else
        project_version=
        if [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}" ] \
          || [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ]; then
          echo 'FAIL: les variables de Merge Request GitLab doivent être vides hors merge_request_event.' >&2
          exit 1
        fi
        if [ -n "${CI_COMMIT_BRANCH:-}" ] && [ -n "${CI_COMMIT_TAG:-}" ]; then
          echo 'FAIL: un pipeline GitLab ne peut pas porter simultanément une branche et un tag.' >&2
          exit 1
        elif [ -n "${CI_COMMIT_BRANCH:-}" ]; then
          sh ci/check-branch-name.sh "$CI_COMMIT_BRANCH" gitlab-branch
        elif [ -n "${CI_COMMIT_TAG:-}" ]; then
          if [ "${CI_COMMIT_REF_PROTECTED:-}" != true ]; then
            echo "FAIL: le tag GitLab $CI_COMMIT_TAG doit être protégé." >&2
            exit 1
          fi
          if ! printf '%s' "$CI_COMMIT_TAG" | grep -Eq \
            '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$'; then
            echo "FAIL: tag GitLab hors convention SemVer : $CI_COMMIT_TAG." >&2
            exit 1
          fi
          printf 'TAG_REF=%s\n' "$CI_COMMIT_TAG"
        else
          echo "FAIL: source ou ref GitLab indéterminée : source=${CI_PIPELINE_SOURCE:-<vide>}." >&2
          exit 1
        fi
      fi
      sh ci/check-gitlab-merge-request.sh "$project_version"
    - sh scripts/tests/check-no-secrets.Tests.sh
    - sh ci/test-dependency-check.sh
    - sh ci/test-package-guards.sh
    - ./scripts/check-no-secrets.sh --scope all --base "${CI_COMMIT_BEFORE_SHA:-}"
    - |
      if [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] \
        && ! printf '%s' "$CI_COMMIT_BEFORE_SHA" | grep -Eq '^0+$' \
        && git cat-file -e "${CI_COMMIT_BEFORE_SHA}^{commit}" 2>/dev/null; then
        git diff --check "${CI_COMMIT_BEFORE_SHA}...HEAD"
      else
        git show --check --format= HEAD
      fi

test:linux:
  extends: .maven-java25
  stage: test
  services:
    - name: "docker.io/library/docker@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07"
      alias: docker
      command:
        - --tls=false
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  timeout: 45m
  script:
    - ./mvnw -B -ntp -Pintegration clean verify
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
      - target/failsafe-reports/

quality:observe:
  extends: .maven-java25
  stage: observe
  allow_failure: true
  timeout: 30m
  script:
    - |
      status=0
      ./mvnw -B -ntp \
        org.jacoco:jacoco-maven-plugin:0.8.15:prepare-agent \
        test \
        org.jacoco:jacoco-maven-plugin:0.8.15:report || status=$?
      if [ ! -s target/jacoco.exec ]; then
        echo 'FAIL: les données d’exécution JaCoCo sont absentes ou vides.' >&2
        status=1
      fi
      if [ ! -s target/site/jacoco/jacoco.xml ]; then
        echo 'FAIL: le rapport XML JaCoCo est absent ou vide.' >&2
        status=1
      fi
      ./mvnw -B -ntp -DskipTests \
        org.apache.maven.plugins:maven-pmd-plugin:3.28.0:pmd \
        org.apache.maven.plugins:maven-pmd-plugin:3.28.0:cpd || status=$?
      ./mvnw -B -ntp -DskipTests \
        org.apache.maven.plugins:maven-javadoc-plugin:3.12.0:javadoc || status=$?
      exit "$status"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - target/site/jacoco/
      - target/site/apidocs/
      - target/pmd.xml
      - target/cpd.xml

security:dependencies:
  extends: .maven-java25
  stage: observe
  timeout: 60m
  cache: []
  script:
    - sh ci/run-dependency-check.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - target/dependency-check-report.*
      - target/dependency-check-gitlab.json

.package:
  extends: .maven-java25
  stage: package
  dependencies: []
  script:
    - source_epoch=$(git show -s --format=%ct "$CI_COMMIT_SHA")
    - ./mvnw -B -ntp -DskipTests
      -Dproject.build.outputTimestamp="$source_epoch" clean package
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        tag_version="${CI_COMMIT_TAG#v}"
        case "$tag_version" in
          *-rc.*)
            tag_core="${tag_version%-rc.*}"
            tag_rc="${tag_version##*-rc.}"
            case "$tag_rc" in
              ???*)
                echo "FAIL: le tag $CI_COMMIT_TAG dépasse la plage des branches RC01..RC99." >&2
                exit 1
                ;;
              [1-9]) tag_rc="0${tag_rc}" ;;
            esac
            branch_train="${tag_core}-RC${tag_rc}"
            ;;
          *) branch_train="$tag_version" ;;
        esac
        feature_branch="feature/V${branch_train}"
        release_branch="release/V${branch_train}"
        git fetch --no-tags origin \
          "+refs/heads/main:refs/remotes/origin/main" \
          "+refs/heads/${feature_branch}:refs/remotes/origin/${feature_branch}" \
          "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
      fi
      sh ci/package-artifact.sh
  artifacts:
    paths:
      - target/distribution/

package:snapshot:
  extends: .package
  artifacts:
    name: "betting-project-snapshot-${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths:
      - target/distribution/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^feature\/V(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-RC(0[1-9]|[1-9][0-9])(-SNAPSHOT)?)?$/'

package:release:
  extends: .package
  artifacts:
    name: "betting-project-${CI_COMMIT_TAG}"
    expire_in: never
    paths:
      - target/distribution/
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/'
