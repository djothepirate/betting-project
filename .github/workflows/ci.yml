name: CI

"on":
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows — wrapper, build et sécurité
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Extraire le dépôt avec son historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Vérifier le Maven Wrapper
        shell: pwsh
        run: .\mvnw.cmd -version

      - name: Tester la propagation des échecs Windows
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\tests\verify-windows.Tests.ps1

      - name: Tester le scanner de secrets Windows
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\tests\check-no-secrets.Tests.ps1

      - name: Contrôler le dépôt et les changements Git
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\check-no-secrets.ps1 -Scope All -BaseRef $env:SECRET_SCAN_BASE

      - name: Compiler et exécuter les tests standards
        shell: pwsh
        run: .\mvnw.cmd verify

      - name: Vérifier le diff
        shell: pwsh
        run: |
          $baseCommit = $env:SECRET_SCAN_BASE
          $baseObject = "$baseCommit^{commit}"
          git cat-file -e $baseObject 2>$null
          if ($baseCommit -and $baseCommit -notmatch '^0+$' -and $LASTEXITCODE -eq 0) {
            git diff --check "$baseCommit...HEAD"
          } else {
            git show --check --format= HEAD
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    name: Linux — wrapper, PostgreSQL et sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Extraire le dépôt avec son historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Vérifier le Maven Wrapper
        run: ./mvnw -version

      - name: Tester le scanner de secrets POSIX
        run: sh scripts/tests/check-no-secrets.Tests.sh

      - name: Contrôler le dépôt et les changements Git
        run: ./scripts/check-no-secrets.sh --scope all --base "$SECRET_SCAN_BASE"

      - name: Compiler et exécuter les tests standards
        run: ./mvnw verify

      - name: Exécuter l'intégration PostgreSQL/Testcontainers
        run: ./mvnw -Pintegration verify

      - name: Vérifier le diff
        run: |
          if [ -n "$SECRET_SCAN_BASE" ] \
            && ! printf '%s' "$SECRET_SCAN_BASE" | grep -Eq '^0+$' \
            && git cat-file -e "${SECRET_SCAN_BASE}^{commit}" 2>/dev/null; then
            git diff --check "${SECRET_SCAN_BASE}...HEAD"
          else
            git show --check --format= HEAD
          fi
