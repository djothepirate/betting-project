name: CI

"on":
  # Les branches de travail sont qualifiées sur leur merge synthétique via la PR.
  # Ne pas ajouter ici leurs motifs : un run push ne doit jamais remplacer ce contrôle.
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows — wrapper, build et sécurité
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Extraire le dépôt avec son historique
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Vérifier le Maven Wrapper
        shell: pwsh
        run: .\mvnw.cmd -version

      - name: Tester la propagation des échecs Windows
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\tests\verify-windows.Tests.ps1

      - name: Tester le scanner de secrets Windows
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\tests\check-no-secrets.Tests.ps1

      - name: Contrôler le dépôt et les changements Git
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\check-no-secrets.ps1 -Scope All -BaseRef $env:SECRET_SCAN_BASE

      - name: Compiler et exécuter les tests standards
        shell: pwsh
        run: .\mvnw.cmd -B -ntp verify

      - name: Vérifier le diff
        shell: pwsh
        run: |
          $baseCommit = $env:SECRET_SCAN_BASE
          $baseObject = "$baseCommit^{commit}"
          git cat-file -e $baseObject 2>$null
          if ($baseCommit -and $baseCommit -notmatch '^0+$' -and $LASTEXITCODE -eq 0) {
            git diff --check "$baseCommit...HEAD"
          } else {
            git show --check --format= HEAD
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    name: Linux — wrapper, PostgreSQL, sécurité et artefact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Extraire le dépôt avec son historique
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Vérifier le Maven Wrapper
        run: ./mvnw -version

      - name: Vérifier la convention de branche 1A
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: sh ci/check-branch-name.sh "$BRANCH_NAME"

      - name: Tester le scanner de secrets POSIX
        run: sh scripts/tests/check-no-secrets.Tests.sh

      - name: Tester les garde-fous de provenance et de release
        run: sh ci/test-package-guards.sh

      - name: Contrôler le dépôt et les changements Git
        run: ./scripts/check-no-secrets.sh --scope all --base "$SECRET_SCAN_BASE"

      - name: Compiler et exécuter les tests standards
        run: ./mvnw -B -ntp verify

      - name: Exécuter l'intégration PostgreSQL/Testcontainers
        run: ./mvnw -B -ntp -Pintegration verify

      - name: Produire le snapshot ou valider le bundle tagué
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: sh ci/package-artifact.sh

      # Les bundles exécutables issus des PR restent éphémères dans le workspace du runner.
      - name: Publier le snapshot issu de main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: betting-project-${{ github.run_id }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: target/distribution/

      - name: Vérifier le diff
        run: |
          if [ -n "$SECRET_SCAN_BASE" ] \
            && ! printf '%s' "$SECRET_SCAN_BASE" | grep -Eq '^0+$' \
            && git cat-file -e "${SECRET_SCAN_BASE}^{commit}" 2>/dev/null; then
            git diff --check "${SECRET_SCAN_BASE}...HEAD"
          else
            git show --check --format= HEAD
          fi
